; AGOS test robot: ESP32-C3 SuperMini micro-ROS motor node (L298N, two DC motors)
;
; Build and flash from the laptop (VS Code + PlatformIO, or the pio command):
;   pio run -e serial -t upload        USB to the Raspberry Pi (the default, recommended)
;   pio run -e wifi -t upload          Wi-Fi to the micro-ROS agent instead (set it up in config.h)
;   pio run -t clean_microros          rebuild the micro-ROS library after changing distro/transport
;
; The first build downloads and compiles micro-ROS (5-15 minutes, once per env).

[platformio]
default_envs = serial

[env]
platform = espressif32
; The SuperMini is wired like Espressif's ESP32-C3-DevKitM-1 (4 MB flash, native USB)
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
monitor_speed = 115200
; Must match the micro-ROS agent's Docker tag on the Pi (agos_robot: microros/micro-ros-agent:kilted)
board_microros_distro = kilted
lib_deps =
    https://github.com/micro-ROS/micro_ros_platformio
; The SuperMini has no USB-UART chip: "Serial" is the C3's own USB port (USB CDC)
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:serial]
board_microros_transport = serial

[env:wifi]
board_microros_transport = wifi
