# robot_localization EKF: the robot's odometry (/odom and the odom ->
# base_footprint TF), started by sim.launch.py (arg ekf, default true).
#
# Why: the track encoders (DiffDrive, published as /wheel/odom) measure how far
# the robot drives well, but not how far it turns. Tracks skid when the robot
# turns, and in a pipe bend the curved walls steer the robot as much as the
# tracks do. In the test pipe the wheel odometry's heading was off by 60 deg
# after one S-bend, and every metre after that went in the wrong direction on
# the map. The IMU's gyro measures the real turn rate, so the EKF takes the
# speed from the tracks and the turning from the gyro.
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 50.0
    two_d_mode: true            # ground robot: x, y, yaw
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Track encoders: forward speed, and zero sideways speed (tracks don't
    # slide sideways while driving).
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  true,  false,
                   false, false, false,
                   false, false, false]
    odom0_differential: false

    # IMU gyro: turn rate only (no magnetometer heading in a buried pipe).
    # /imu/level is /imu/data with the gyro's z rate replaced by the heading's
    # rate of turn (imu_level, started with this EKF): tilted on a pipe wall,
    # the gyro's z axis measures only part of a turn.
    imu0: /imu/level
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
